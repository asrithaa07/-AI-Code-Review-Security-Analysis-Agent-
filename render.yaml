services:
  - type: web
    name: ai-code-review-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install torch torchvision --extra-index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt --no-cache-dir"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0 # Standardize python version on Render
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
