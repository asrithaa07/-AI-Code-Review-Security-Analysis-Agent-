services:
  postgres:
    image: postgres:16-alpine
    container_name: code-review-db
    environment:
      POSTGRES_USER: codereview
      POSTGRES_PASSWORD: codereview
      POSTGRES_DB: code_review_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codereview -d code_review_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
